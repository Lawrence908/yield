      - generic [ref=f9e148]:
        - paragraph [ref=f9e149]:
          - text: Three footnotes the table earns.
          - strong [ref=f9e150]: "1966"
          - text: ": the curve inverted twice and no recession came within the window; the false positives stay."
          - strong [ref=f9e151]: "2019"
          - text: ": the inversion was followed by the 2020 recession, but that recession arrived with a pandemic, so how much credit the curve deserves is genuinely unknowable."
          - strong [ref=f9e152]: "2022"
          - text: ": the newest episode, 27 months inverted with a trough of −1.71 pp, has not been followed by a recession as of the NBER data through Aug 2026; the row stays open rather than being scored either way."
        - paragraph [ref=f9e153]: "One pattern worth knowing before reading the current re-steepening as relief: in several scored episodes (1990, 2001, 2008) the recession began only after the spread had climbed back above zero. Un-inversion is not an all-clear; in this record it is often the last act before the downturn. The start and end columns above let you check that claim against every row."
    - generic [ref=f9e154]:
      - 'heading "The whole curve: which end moved" [level=2] [ref=f9e155]'
      - paragraph [ref=f9e156]: "One borrower, the United States Treasury, quoted at seven maturities. Normally the curve slopes up: lending for thirty years pays more than lending for three months, because money locked away longer carries more risk and wants compensating. An inverted curve is that ordering reversed, short-term debt yielding more than long-term debt of the same credit quality, which is the market pricing in lower rates later. Inversion is only ever defined against a stated pair, and any two tenors can invert independently. Drawn heavy: the 10-year and the 2-year, the pair the headlines mean. The rest of this page uses 10-year minus 3-month instead, the pair the New York Fed's research is built on. The thin lines fill in the tenors between, which is how you can see whether an episode was the short end rocketing while the long end sat, as in 2022, or both ends chasing inflation upward together, as in the late 1970s."
      - paragraph [ref=f9e157]: "The band between those two lines is the 10y−2y spread itself, shaded grey while the curve is the right way up and red wherever the 2-year is paying more than the 10-year, which is the inversion, drawn rather than left to be inferred from two lines crossing. Across this many decades a half-point inversion is only a few pixels of shading, so the red strip under the axis marks the same inverted stretches again at a constant height: it is there to answer when, not how long, and the very briefest crossings are drawn a touch wider than they lasted. Click any thin tenor in the legend to bring it up to full weight. Lines start on different dates because the series do: 1962 for the 1, 3, 5 and 10-year, June 1976 for the 2-year, February 1977 for the 30-year, and September 1981 for the 3-month, which is exactly why the published daily 10y−3m spread starts in 1982."
