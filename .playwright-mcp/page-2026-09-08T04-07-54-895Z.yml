    - generic [ref=f9e200]:
      - heading "The New York Fed's probability" [level=2] [ref=f9e201]
      - paragraph [ref=f9e202]: The one forecast on this page, and it is not ours.
      - generic [ref=f9e203]:
        - paragraph [ref=f9e204]:
          - text: "The New York Fed reads this same monthly spread through a probit model and publishes the probability of a US recession within twelve months. Their latest:"
          - generic [ref=f9e205]: 15.2%
          - text: by Jul 2027, estimated from Jul 2026 data. Details and history at
          - link "their FAQ" [ref=f9e206] [cursor=pointer]:
            - /url: https://www.newyorkfed.org/research/capital_markets/ycfaq
          - text: .
        - paragraph [ref=f9e207]: "They publish it as a legacy spreadsheet, so the value is entered here by hand and dated: last checked 2026-09-07. A number that looks fresh because a script touched a file would be worse than one that is honestly dated. This page computes no probabilities of its own."
    - generic [ref=f9e208]:
      - heading "Revisions to published history" [level=2] [ref=f9e209]
      - paragraph [ref=f9e210]: No revisions to already-published observations logged yet.
      - paragraph [ref=f9e211]: "Treasury constant-maturity yields are near-final the day they are published, unlike the labour and survey data elsewhere in this collection, so this log is expected to stay short. That makes it more interesting, not less: an entry here means Treasury or the Bank of Canada restated a number this page had already shown. Every refresh is diffed against the one before it; new observations are not revisions and are not listed."
