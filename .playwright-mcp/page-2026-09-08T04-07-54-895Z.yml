      - paragraph [ref=f9e5]: "When the 3-month Treasury out-yields the 10-year, the curve is inverted, and since the late 1960s a US recession has followed within about two years nearly every time. This page keeps score: the spread daily since 1982 and monthly back to 1953, every inversion episode measured against what actually followed, every recession shaded. Nothing here is a forecast; the one probability shown is the New York Fed's, as published."
