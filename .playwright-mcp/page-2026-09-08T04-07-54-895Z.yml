      - paragraph [ref=f9e190]: "The Bank of Canada publishes the legs, not the spread, so the subtraction happens here: 10-year benchmark minus 3-month bill, daily from 2001 because that is the Valet platform's depth, not the bond market's. The dotted monthly series reaches back to 1956 via the OECD, whose short leg is an interbank rate rather than a bill; where the two overlap the gap between them is that basis difference, shown rather than smoothed over. Shading is the C.D. Howe Business Cycle Council chronology."
